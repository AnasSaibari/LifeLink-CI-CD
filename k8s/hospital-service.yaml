apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-service
  template:
    metadata:
      labels:
        app: hospital-service
    spec:
      containers:
        - name: hospital-service
          image: anasdevops/hospitalservice:latest
          ports:
            - containerPort: 9093
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-db:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-service
spec:
  type: ClusterIP
  selector:
    app: hospital-service
  ports:
    - port: 9093
      targetPort: 9093
